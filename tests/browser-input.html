<!doctype html>
<meta charset="utf-8">
<title>拼豆输入回归检查</title>
<style>body{margin:0;background:#f5efeb;font:13px sans-serif}nav{height:60px;display:flex;align-items:center;justify-content:center;gap:8px}button{padding:9px}iframe{display:block;margin:auto;width:390px;height:844px;border:0}p{text-align:center;margin:8px}</style>
<nav><button id="zoom">放大</button><button id="right">右键移动</button><button id="space">空格移动</button><button id="stroke">连续铺豆</button></nav>
<iframe src="/first-level/" title="实际游戏"></iframe>
<p id="status">先点放大到200%，再依次检查右键、空格和铺豆。</p>
<script>
// This test page dispatches browser input only. It never reads or changes game state.
const frame=document.querySelector('iframe'), status=document.querySelector('#status');
function mouse(type,x,y,button,buttons){
  const win=frame.contentWindow,canvas=win.document.querySelector('canvas'),rect=canvas.getBoundingClientRect();
  canvas.dispatchEvent(new win.MouseEvent(type,{view:win,bubbles:true,cancelable:true,clientX:rect.left+x*rect.width/390,clientY:rect.top+y*rect.height/844,button,buttons}));
}
function drag(from,to,button=0){
  mouse('mousedown',...from,button,button===2?2:1);
  for(let i=1;i<=16;i++)mouse('mousemove',from[0]+(to[0]-from[0])*i/16,from[1]+(to[1]-from[1])*i/16,button,button===2?2:1);
  mouse('mouseup',...to,button,0);
}
function key(type){const win=frame.contentWindow,canvas=win.document.querySelector('canvas');canvas.focus();canvas.dispatchEvent(new win.KeyboardEvent(type,{code:'Space',key:' ',keyCode:32,which:32,bubbles:true,cancelable:true}));}
for(const button of document.querySelectorAll('button'))button.onclick=async()=>{
  document.querySelectorAll('button').forEach(b=>b.disabled=true);
  try{
    if(button.id==='zoom'){const win=frame.contentWindow,canvas=win.document.querySelector('canvas'),rect=canvas.getBoundingClientRect();for(let i=0;i<5;i++)canvas.dispatchEvent(new win.WheelEvent('wheel',{bubbles:true,cancelable:true,clientX:rect.left+195,clientY:rect.top+381,deltaY:-120}));}
    if(button.id==='right')drag([138,187],[218,277],2);
    if(button.id==='space'){key('keydown');try{drag([218,277],[178,237]);}finally{key('keyup');}}
    if(button.id==='stroke')drag([110,282.4],[355,282.4]);
    status.textContent=button.textContent+'已执行，请核对棋盘位置和实际计数。';
  }finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}
};
</script>
